# Fotos do helper: origem, prioridade de download e detecção de logo. Editável.

[fabricante]
# sites que são a loja do próprio fabricante: foto é de catálogo de fabricante
sites = ["universal"]
# hosts de imagem de fabricante (mesmo quando o anúncio é de loja)
hosts = ["universalautomotive.vteximg.com.br"]

[prioridade]
# peça "com cara", que o Reconhecimento mais usa, é baixada primeiro (fotos --prioridade / --so-prioridade).
# palavra em qualquer posição do tipo de peça: CHOQUE DIANTEIRO (para-choque), LENTE RETROVISOR, MOLDURA FAROL...
palavras = ["LANTERNA", "LANTERNINHA", "FAROL", "FAROLETE", "PARACHOQUE", "CHOQUE", "RETROVISOR", "GRADE",
            "PARALAMA", "LAMA", "CAPO", "MACANETA"]
# só quando o tipo começa assim: PORTA DIANTEIRA sim, FECHADURA PORTA não
comeca_com = ["PORTA", "TAMPA TRASEIRA", "TAMPA PORTA MALAS"]
# tipo que começa assim nunca é prioritário: LAMPADA FAROL é lâmpada, não farol
nunca = ["LAMPADA"]

[logo]
# a mesma imagem (dHash) em mais peças do que isto é logo ou "sem foto": fica não publicável
max_pecas = 20

[download]
tentativas_maximas = 3
paralelo = 4
